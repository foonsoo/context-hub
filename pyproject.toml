[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "context-hub"
version = "0.1.0"
description = "Client-neutral context sharing and knowledge curation for AI coding agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
test = ["pytest>=8"]

[project.scripts]
ctx = "context_hub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: builds and installs a wheel"]
